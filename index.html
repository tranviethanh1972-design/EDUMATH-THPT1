                          onClick={() => setCurrentQIndex(prev => Math.min(flatQuestions.length - 1, prev + 1))}
                          className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-sm transition"
                        >
                          Câu Tiếp Theo
                        </button>
                      ) : !quizSubmitted ? (
                        <button
                          onClick={() => handleFinishQuiz(false)}
                          className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold shadow-md transition"
                        >
                          Nộp Bài Thi
                        </button>
                      ) : null}
                    </div>
                  </>
                )}
              </div>

              {/* Question Map Grid */}
              <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-5 h-fit lg:sticky lg:top-40">
                <h4 className="font-bold text-slate-800 text-sm pb-2 border-b border-slate-100 flex items-center gap-2">
                  <Layers className="w-4 h-4 text-indigo-500" />
                  Sơ Đồ Câu Hỏi ({flatQuestions.length})
                </h4>

                <div className="max-h-[55vh] overflow-y-auto pr-1 space-y-5">
                  {[1, 2, 3].map(partNum => {
                    const partItems = flatQuestions.filter(item => item.part === partNum);
                    if (partItems.length === 0) return null;

                    return (
                      <div key={partNum}>
                        <div className={`text-[10px] font-bold px-2.5 py-1 rounded-md mb-2.5 inline-block uppercase tracking-wider ${partNum === 1 ? 'text-indigo-700 bg-indigo-50' : partNum === 2 ? 'text-emerald-700 bg-emerald-50' : 'text-amber-700 bg-amber-50'}`}>
                          PHẦN {partNum === 1 ? 'I' : partNum === 2 ? 'II' : 'III'}
                        </div>
                        <div className="grid grid-cols-5 gap-2">
                          {partItems.map((item) => {
                            const globalIdx = item.globalIndex;
                            const isAnswered = isQuestionAnswered(item);
                            const isCurrent = globalIdx === currentQIndex;

                            return (
                              <button
                                key={globalIdx}
                                onClick={() => setCurrentQIndex(globalIdx)}
                                className={`h-10 rounded-lg font-bold text-xs transition-all flex items-center justify-center border shadow-sm ${
                                  isAnswered ? 'bg-indigo-600 text-white border-indigo-700' : 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200'
                                } ${isCurrent ? 'ring-2 ring-offset-2 ring-indigo-500 scale-105' : ''}`}
                              >
                                {item.localIndex + 1}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ActiveQuizTaking({
      quiz,
      currentStudent,
      userAnswers,
      setUserAnswers,
      flaggedQuestions,
      setFlaggedQuestions,
      timeLeft,
      quizSubmitted,
      scoreResult,
      handleFinishQuiz,
      exitQuiz,
      showToast
    }) {
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const currentQ = quiz.questions[currentQIndex];

      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const audioRef = useRef(null);

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      const selectAnswer = (qId, optionIdx) => {
        if (quizSubmitted) return;
        setUserAnswers(prev => ({ ...prev, [qId]: optionIdx }));
      };

      const toggleFlag = (qId) => {
        if (quizSubmitted) return;
        setFlaggedQuestions(prev => ({ ...prev, [qId]: !prev[qId] }));
      };

      const handlePlayAudioSolution = async () => {
        if (isPlayingAudio) {
          if (audioRef.current) audioRef.current.pause();
          setIsPlayingAudio(false);
          return;
        }

        setIsPlayingAudio(true);
        try {
          const textToSpeak = `Câu hỏi: ${currentQ.question.replace(/\$/g, '')}. Đáp án đúng là đáp án ${String.fromCharCode(65 + currentQ.correct)}. Lời giải chi tiết: ${currentQ.explanation.replace(/\$/g, '')}`;
          const url = await callGeminiTTS(textToSpeak);
          
          if (audioRef.current) {
            audioRef.current.src = url;
            audioRef.current.play();
          }
        } catch (err) {
          setIsPlayingAudio(false);
        }
      };

      return (
        <div className="space-y-6">
          <audio ref={audioRef} onEnded={() => setIsPlayingAudio(false)} className="hidden" />

          <div className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-wrap items-center justify-between gap-4 sticky top-20 z-30">
            <div className="flex items-center space-x-3">
              <button
                onClick={exitQuiz}
                className="p-2 text-slate-500 hover:bg-slate-100 rounded-xl transition-all"
                title="Thoát danh sách đề"
              >
                <ArrowLeft className="w-5 h-5" />
              </button>
              <div>
                <h2 className="font-bold text-slate-900 text-base">{quiz.title}</h2>
                <p className="text-xs text-slate-500">Khối {quiz.grade} • {quiz.questions.length} câu hỏi</p>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              <button
                onClick={() => {
                  if (currentStudent?.isPremium) {
                    window.print();
                  } else {
                    if (showToast) showToast('Tính năng Tải/In file PDF đề thi chỉ dành cho tài khoản VIP!', 'info');
                  }
                }}
                className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs md:text-sm font-bold border transition-all ${currentStudent?.isPremium ? 'bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100' : 'bg-slate-100 text-slate-400 border-slate-200'}`}
                title="Tải PDF Đề Thi"
              >
                {currentStudent?.isPremium ? <Download className="w-4 h-4" /> : <Lock className="w-4 h-4" />}
                <span className="hidden sm:inline">Xuất PDF</span>
              </button>

              {!quizSubmitted ? (
                <div className={`flex items-center space-x-2 px-3 py-1.5 rounded-xl border text-sm font-bold ${
                  timeLeft < 180 ? 'bg-rose-50 text-rose-600 border-rose-200 animate-pulse' : 'bg-indigo-50 text-indigo-700 border-indigo-200'
                }`}>
                  <Clock className="w-4 h-4" />
                  <span>{formatTime(timeLeft)}</span>
                </div>
              ) : (
                <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1">
                  <CheckCircle className="w-4 h-4" />
                  Đã Hoàn Thành
                </span>
              )}

              {!quizSubmitted && (
                <button
                  onClick={() => handleFinishQuiz(false)}
                  className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md transition-all"
                >
                  Nộp Bài
                </button>
              )}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div className="lg:col-span-3 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-6 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between pb-4 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <span className="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-lg">
                      Câu {currentQIndex + 1} / {quiz.questions.length}
                    </span>
                    {flaggedQuestions[currentQ.id] && (
                      <span className="bg-amber-100 text-amber-800 text-xs font-semibold px-2 py-0.5 rounded-md flex items-center gap-1">
                        <Bookmark className="w-3 h-3 fill-amber-600" />
                        Đã xem lại
                      </span>
                    )}
                  </div>

                  {!quizSubmitted && (
                    <button
                      onClick={() => toggleFlag(currentQ.id)}
                      className={`text-xs font-medium flex items-center space-x-1 px-2.5 py-1 rounded-lg transition-all ${
                        flaggedQuestions[currentQ.id]
                          ? 'bg-amber-100 text-amber-800 font-semibold'
                          : 'text-slate-500 hover:bg-slate-100'
                      }`}
                    >
                      <Bookmark className="w-3.5 h-3.5" />
                      <span>{flaggedQuestions[currentQ.id] ? 'Bỏ đánh dấu' : 'Đánh dấu câu này'}</span>
                    </button>
                  )}
                </div>

                <div className="py-4 text-slate-900 font-medium text-base leading-relaxed">
                  <MathText text={currentQ.question} />
                </div>

                {currentQ.image && (
                  <SvgGraphViewer image={currentQ.image} />
                )}

                <div className="space-y-3 mt-2">
                  {currentQ.options.map((optionText, optIdx) => {
                    const isSelected = userAnswers[currentQ.id] === optIdx;

                    return (
                      <button
                        key={optIdx}
                        onClick={() => selectAnswer(currentQ.id, optIdx)}
                        disabled={quizSubmitted}
                        className={`w-full p-4 rounded-xl border text-left text-sm transition-all flex items-start space-x-3 ${isSelected ? 'bg-indigo-50 border-indigo-600 text-indigo-950 font-semibold ring-2 ring-indigo-500/20' : 'border-slate-200 hover:border-indigo-300 hover:bg-slate-50'}`}
                      >
                        <span className={`w-6 h-6 rounded-full border text-xs font-bold flex items-center justify-center shrink-0 ${
                          isSelected 
                            ? 'bg-indigo-600 text-white border-indigo-600' 
                            : 'border-slate-300 text-slate-600'
                        }`}>
                          {String.fromCharCode(65 + optIdx)}
                        </span>

                        <div className="flex-1 pt-0.5">
                          <MathText text={optionText} />
                        </div>
                      </button>
                    );
                  })}
                </div>

                {quizSubmitted && currentStudent?.isPremium && (
                  <div className="mt-6 p-4 bg-amber-50 rounded-xl border border-amber-200 text-xs space-y-3">
                    <div className="flex items-center justify-between border-b border-amber-200 pb-2">
                      <div className="font-bold text-amber-900 flex items-center gap-1">
                        <HelpCircle className="w-4 h-4 text-amber-700" />
                        <span>Lời giải chi tiết SGK:</span>
                      </div>

                      <button
                        onClick={handlePlayAudioSolution}
                        className="px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-bold flex items-center gap-1 transition-all text-[11px]"
                      >
                        <Volume2 className="w-3.5 h-3.5" />
                        <span>{isPlayingAudio ? 'Dừng Đọc AI' : '🔊 Nghe AI Đọc Lời Giải'}</span>
                      </button>
                    </div>

                    <div className="text-slate-800 leading-relaxed pl-2">
                      <MathText text={currentQ.explanation || 'Không có giải thích.'} />
                    </div>
                  </div>
                )}
              </div>

              <div className="pt-6 border-t border-slate-100 flex items-center justify-between">
                <button
                  onClick={() => setCurrentQIndex(prev => Math.max(0, prev - 1))}
                  disabled={currentQIndex === 0}
                  className="px-4 py-2 rounded-xl border border-slate-200 text-slate-700 text-xs font-semibold hover:bg-slate-50 disabled:opacity-40"
                >
                  Câu Trước
                </button>

                {currentQIndex < quiz.questions.length - 1 ? (
                  <button
                    onClick={() => setCurrentQIndex(prev => Math.min(quiz.questions.length - 1, prev + 1))}
                    className="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-sm"
                  >
                    Câu Tiếp Theo
                  </button>
                ) : !quizSubmitted ? (
                  <button
                    onClick={() => handleFinishQuiz(false)}
                    className="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-sm"
                  >
                    Nộp Bài Thi
                  </button>
                ) : null}
              </div>
            </div>

            <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-5 h-fit">
              <h4 className="font-bold text-slate-800 text-sm pb-2 border-b border-slate-100">
                Sơ Đồ Câu Hỏi ({quiz.questions.length})
              </h4>

              <div className="grid grid-cols-5 gap-2">
                {quiz.questions.map((q, idx) => {
                  const isAnswered = userAnswers[q.id] !== undefined;
                  const isFlagged = flaggedQuestions[q.id];
                  const isCurrent = idx === currentQIndex;

                  let btnBg = "bg-slate-100 text-slate-700 border-slate-200";
                  if (isAnswered) btnBg = "bg-indigo-600 text-white font-bold";

                  return (
                    <button
                      key={q.id}
                      onClick={() => setCurrentQIndex(idx)}
                      className={`h-9 rounded-lg font-semibold text-xs transition-all relative flex items-center justify-center border ${btnBg} ${
                        isCurrent ? 'ring-2 ring-offset-1 ring-indigo-500' : ''
                      }`}
                    >
                      {idx + 1}
                      {isFlagged && !quizSubmitted && (
                        <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-400 rounded-full border border-white" />
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function QuizFormBuilder({ editingQuiz, onSave, onExportSingleQuiz, onCancel, showToast }) {
      const [grade, setGrade] = useState(editingQuiz ? editingQuiz.grade : '12');
      const [title, setTitle] = useState(editingQuiz ? editingQuiz.title : '');
      const [duration, setDuration] = useState(editingQuiz ? editingQuiz.duration : 15);
      const [description, setDescription] = useState(editingQuiz ? editingQuiz.description : '');

      const [aiTopic, setAiTopic] = useState('');
      const [aiQuestionCount, setAiQuestionCount] = useState(3);
      const [isAiGenerating, setIsAiGenerating] = useState(false);

      const [questions, setQuestions] = useState(
        editingQuiz && editingQuiz.questions && editingQuiz.questions.length > 0 
          ? editingQuiz.questions 
          : [
            {
              id: 1,
              question: 'Cho hàm số $y = x^2 - 4x + 3$. Tọa độ đỉnh Parabol là:',
              options: ['$I(2; -1)$', '$I(-2; 15)$', '$I(4; 3)$', '$I(2; 1)$'],
              correct: 0,
              explanation: 'Hoành độ đỉnh $x = -b/2a = 2 \\Rightarrow y = -1$.',
              image: null
            }
          ]
      );

      const addQuestion = () => {
        setQuestions(prev => [
          ...prev,
          {
            id: Date.now(),
            question: 'Câu hỏi mới...',
            options: ['$A$', '$B$', '$C$', '$D$'],
            correct: 0,
            explanation: 'Lời giải chi tiết...',
            image: null
          }
        ]);
      };

      const removeQuestion = (index) => {
        if (questions.length <= 1) return;
        setQuestions(prev => prev.filter((_, idx) => idx !== index));
      };

      const updateQuestionText = (index, val) => {
        setQuestions(prev => prev.map((q, idx) => idx === index ? { ...q, question: val } : q));
      };

      const updateQuestionImage = (index, imgBase64) => {
        setQuestions(prev => prev.map((q, idx) => idx === index ? { ...q, image: imgBase64 } : q));
      };

      const updateOptionText = (qIndex, optIndex, val) => {
        setQuestions(prev => prev.map((q, idx) => {
          if (idx === qIndex) {
            const newOpts = [...q.options];
            newOpts[optIndex] = val;
            return { ...q, options: newOpts };
          }
          return q;
        }));
      };

      const setCorrectOption = (qIndex, optIndex) => {
        setQuestions(prev => prev.map((q, idx) => idx === qIndex ? { ...q, correct: optIndex } : q));
      };

      const updateExplanation = (index, val) => {
        setQuestions(prev => prev.map((q, idx) => idx === index ? { ...q, explanation: val } : q));
      };

      const handleGeminiAiGenerate = async () => {
        if (!aiTopic.trim()) return;
        setIsAiGenerating(true);

        const prompt = `Hãy biên soạn đúng ${aiQuestionCount} câu hỏi trắc nghiệm Toán Khối ${grade} thuộc chủ đề: "${aiTopic}". BẮT BUỘC đặt mọi công thức toán trong thẻ $...$. Trả về JSON theo schema.`;

        const QUESTION_SCHEMA = {
          type: "ARRAY",
          items: {
            type: "OBJECT",
            properties: {
              question: { type: "STRING" },
              options: { type: "ARRAY", items: { type: "STRING" } },
              correct: { type: "INTEGER" },
              explanation: { type: "STRING" }
            },
            required: ["question", "options", "correct", "explanation"]
          }
        };

        try {
          const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: QUESTION_SCHEMA
            }
          };

          const result = await callGeminiAPI(payload);
          const rawJson = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (rawJson) {
            const parsedQuestions = JSON.parse(rawJson);
            const formatted = parsedQuestions.map((q, idx) => ({
              id: Date.now() + idx,
              question: q.question,
              options: q.options,
              correct: q.correct,
              explanation: q.explanation,
              image: null
            }));

            setQuestions(formatted);
            setTitle(`Đề thi AI Gemini: ${aiTopic} (Khối ${grade})`);
            setDescription(`Bộ câu hỏi trắc nghiệm do Gemini tự động khởi tạo theo chủ đề "${aiTopic}" - Khối ${grade}.`);
            if (showToast) showToast(`Gemini API đã tạo thành công ${formatted.length} câu hỏi chuẩn SGK!`, 'success');
          }
        } catch (err) {
          if (showToast) showToast('Lỗi khi gọi Gemini AI.', 'info');
        } finally {
          setIsAiGenerating(false);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title.trim()) return;

        const quizObj = {
          id: editingQuiz ? editingQuiz.id : 'q' + grade + '-' + Date.now(),
          grade,
          title,
          duration: parseInt(duration) || 15,
          description,
          questions
        };

        onSave(quizObj);
      };

      return (
        <form onSubmit={handleSubmit} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-100">
            <div>
              <h3 className="font-bold text-slate-900 text-lg">
                {editingQuiz ? 'Chỉnh Sửa Đề Thi Trắc Nghiệm' : 'Tạo Đề Thi Trắc Nghiệm Mới'}
              </h3>
              <p className="text-xs text-slate-500">Soạn thủ công kèm ảnh đồ thị hoặc dùng Gemini AI Sinh Đề</p>
            </div>

            <div className="flex items-center space-x-2">
              <button
                type="button"
                onClick={onCancel}
                className="text-xs font-semibold text-slate-500 hover:text-slate-800 px-3 py-2 border border-slate-200 rounded-xl"
              >
                Hủy bỏ
              </button>
            </div>
          </div>

          <div className="bg-gradient-to-r from-indigo-900 via-indigo-950 to-purple-950 text-white rounded-2xl p-5 shadow-md border border-indigo-700/50 space-y-3">
            <div className="flex items-center justify-between">
              <div className="flex items-center space-x-2 font-bold text-xs uppercase tracking-wider text-yellow-300">
                <Bot className="w-5 h-5 text-yellow-300 animate-pulse" />
                <span>Trợ Lý Gemini 3 Flash AI Soạn Đề Tự Động</span>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-4 gap-3 pt-1">
              <div className="sm:col-span-2">
                <input
                  type="text"
                  placeholder="Ví dụ: Cấp số cộng, Tích phân hàm ẩn..."
                  value={aiTopic}
                  onChange={(e) => setAiTopic(e.target.value)}
                  className="w-full bg-slate-900/80 border border-indigo-500/50 text-white placeholder-indigo-300/60 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-yellow-400 font-medium"
                />
              </div>

              <div>
                <select
                  value={aiQuestionCount}
                  onChange={(e) => setAiQuestionCount(parseInt(e.target.value))}
                  className="w-full bg-slate-900/80 border border-indigo-500/50 text-white rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-yellow-400"
                >
                  <option value={3}>3 câu hỏi</option>
                  <option value={5}>5 câu hỏi</option>
                  <option value={10}>10 câu hỏi</option>
                </select>
              </div>

              <div>
                <button
                  type="button"
                  onClick={handleGeminiAiGenerate}
                  disabled={isAiGenerating || !aiTopic.trim()}
                  className="w-full h-full py-2 bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-300 hover:to-amber-400 text-slate-950 rounded-xl text-xs font-extrabold shadow-lg transition-all disabled:opacity-50 flex items-center justify-center gap-1.5"
                >
                  <Sparkles className="w-4 h-4 text-slate-950" />
                  <span>{isAiGenerating ? 'AI Đang Sinh Đề...' : 'Gemini AI Sinh Đề'}</span>
                </button>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">Khối Lớp *</label>
              <select
                value={grade}
                onChange={(e) => setGrade(e.target.value)}
                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500"
              >
                <option value="10">Khối 10</option>
                <option value="11">Khối 11</option>
                <option value="12">Khối 12</option>
              </select>
            </div>

            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">Thời Gian Làm Bài (phút) *</label>
              <input
                type="number"
                value={duration}
                onChange={(e) => setDuration(e.target.value)}
                min="1"
                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
                required
              />
            </div>

            <div className="md:col-span-3">
              <label className="block text-xs font-bold text-slate-700 mb-1">Tiêu Đề Bài Tập *</label>
              <input
                type="text"
                placeholder="Ví dụ: Đề ôn tập Chương 1..."
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
                required
              />
            </div>
          </div>

          {/* Question Items with Image Paste */}
          <div className="space-y-4 pt-4 border-t border-slate-100">
            <div className="flex items-center justify-between">
              <h4 className="font-bold text-slate-900 text-sm">
                Danh Sách Câu Hỏi Trắc Nghiệm ({questions.length})
              </h4>
            </div>

            {questions.map((q, qIndex) => (
              <div key={q.id || qIndex} className="bg-slate-50 rounded-2xl p-4 border border-slate-200 space-y-3 relative">
                <div className="flex items-center justify-between">
                  <span className="font-bold text-xs text-indigo-700 bg-indigo-100 px-2.5 py-1 rounded-md">
                    Câu Hỏi {qIndex + 1}
                  </span>
                  {questions.length > 1 && (
                    <button
                      type="button"
                      onClick={() => removeQuestion(qIndex)}
                      className="text-rose-600 hover:text-rose-800 text-xs font-bold flex items-center gap-1"
                    >
                      <Trash2 className="w-3.5 h-3.5" /> Xóa câu
                    </button>
                  )}
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Nội dung câu hỏi</label>
                  {}
                  <KatexToolbar onInsert={(str) => updateQuestionText(qIndex, (q.question || '') + ' ' + str)} />
                  <textarea
                    rows="2"
                    value={q.question}
                    onChange={(e) => updateQuestionText(qIndex, e.target.value)}
                    onPaste={(e) => {
                      const items = e.clipboardData?.items;
                      if (!items) return;
                      for (let i = 0; i < items.length; i++) {
                        if (items[i].type.indexOf("image") !== -1) {
                          const file = items[i].getAsFile();
                          const reader = new FileReader();
                          reader.onload = (ev) => {
                            updateQuestionImage(qIndex, ev.target.result);
                            if (showToast) showToast('Đã dán trực tiếp ảnh đồ thị vào câu hỏi!', 'success');
                          };
                          reader.readAsDataURL(file);
                          e.preventDefault();
                          return;
                        }
                      }
                    }}
                    placeholder="Nhập nội dung câu hỏi (sử dụng $...$ cho công thức toán)..."
                    className="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
                    required
                  />
                  {q.question && (
                    <div className="mt-1.5 p-2.5 bg-indigo-50/70 border border-indigo-100 rounded-xl text-xs text-indigo-950">
                      <span className="font-bold text-[10px] uppercase text-indigo-700 block mb-0.5">Xem trước KaTeX:</span>
                      <MathText text={q.question} />
                    </div>
                  )}
                </div>

                <ImagePasteBox 
                  image={q.image} 
                  onImageChange={(img) => updateQuestionImage(qIndex, img)} 
                  label={`Hình vẽ / Đồ thị câu ${qIndex + 1}`}
                  showToast={showToast}
                />

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {q.options.map((optVal, optIndex) => (
                    <div key={optIndex} className="p-2.5 bg-white border border-slate-200 rounded-xl space-y-1.5">
                      <div className="flex items-center space-x-2">
                        <button
                          type="button"
                          onClick={() => setCorrectOption(qIndex, optIndex)}
                          className={`w-7 h-7 rounded-lg text-xs font-bold shrink-0 transition-all ${
                            q.correct === optIndex 
                              ? 'bg-emerald-600 text-white shadow-sm ring-2 ring-emerald-400' 
                              : 'bg-slate-200 text-slate-700 hover:bg-slate-300'
                          }`}
                          title={`Bấm để chọn ${String.fromCharCode(65 + optIndex)} làm đáp án đúng`}
                        >
                          {String.fromCharCode(65 + optIndex)}
                        </button>
                        <input
                          type="text"
                          value={optVal}
                          onChange={(e) => updateOptionText(qIndex, optIndex, e.target.value)}
                          placeholder={`Đáp án ${String.fromCharCode(65 + optIndex)} (ví dụ: $x = 2$)...`}
                          className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
                          required
                        />
                      </div>
                      {optVal && (
                        <div className="pl-9 text-xs text-slate-700">
                          <span className="text-[10px] text-slate-400 mr-1">Hiển thị:</span>
                          <MathText text={optVal} />
                        </div>
                      )}
                    </div>
                  ))}
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Lời giải chi tiết</label>
                  <KatexToolbar onInsert={(str) => updateExplanation(qIndex, (q.explanation || '') + ' ' + str)} />
                  <textarea
                    rows="2"
                    value={q.explanation}
                    onChange={(e) => updateExplanation(qIndex, e.target.value)}
                    placeholder="Nhập lời giải chi tiết (sử dụng $...$)..."
                    className="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
                  />
                  {q.explanation && (
                    <div className="mt-1.5 p-2 bg-amber-50/70 border border-amber-200/60 rounded-xl text-xs text-amber-950">
                      <span className="font-bold text-[10px] uppercase text-amber-700 block mb-0.5">Xem trước Lời giải KaTeX:</span>
                      <MathText text={q.explanation} />
                    </div>
                  )}
                </div>
              </div>
            ))}

            <button
              type="button"
              onClick={addQuestion}
              className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all"
            >
              <PlusCircle className="w-4 h-4 text-indigo-600" />
              <span>Thêm Câu Hỏi Mới</span>
            </button>
          </div>

          <div className="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
            <button
              type="button"
              onClick={onCancel}
              className="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-50"
            >
              Hủy bỏ
            </button>
            <button
              type="submit"
              className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md transition-all"
            >
              {editingQuiz ? 'Lưu Thay Đổi Đề Thi' : 'Đăng & Lưu Đề Thi'}
            </button>
          </div>
        </form>
      );
    }

    function CustomTemplateMatrixBuilder({ editingQuiz, onSave, onCancel, showToast }) {
      const [grade, setGrade] = useState(editingQuiz ? editingQuiz.grade : '12');
      const [title, setTitle] = useState(editingQuiz ? editingQuiz.title : 'ĐỀ THI ÔN TẬP TOÁN THPT 2025 (Cấu Trúc Mới)');
      const [duration, setDuration] = useState(editingQuiz ? editingQuiz.duration : 90);
      
      const [pdfText, setPdfText] = useState('');
      const [fileName, setFileName] = useState('');
      const [isProcessingPdf, setIsProcessingPdf] = useState(false);
      const [isGenerating, setIsGenerating] = useState(false);

      const [examData, setExamData] = useState({
        part1: editingQuiz && editingQuiz.part1 ? editingQuiz.part1 : [],
        part2: editingQuiz && editingQuiz.part2 ? editingQuiz.part2 : [],
        part3: editingQuiz && editingQuiz.part3 ? editingQuiz.part3 : []
      });

      const [editModalConfig, setEditModalConfig] = useState(null);

      const openEditQuestion = (part, index) => {
        setEditModalConfig({
          part,
          index,
          data: JSON.parse(JSON.stringify(examData[part][index]))
        });
      };

      const handleSaveEditQuestion = () => {
        if (!editModalConfig) return;
        const { part, index, data } = editModalConfig;
        setExamData(prev => {
          const list = [...prev[part]];
          list[index] = data;
          return { ...prev, [part]: list };
        });
        setEditModalConfig(null);
        if (showToast) showToast('Đã cập nhật câu hỏi và đáp án thành công!', 'success');
      };

      const handleDeleteQuestion = (part, index) => {
        setExamData(prev => {
          const list = [...prev[part]];
          list.splice(index, 1);
          return { ...prev, [part]: list };
        });
        if (showToast) showToast('Đã xóa câu hỏi!', 'info');
      };

      const updatePartImage = (part, index, imageBase64) => {
        setExamData(prev => {
          const list = [...prev[part]];
          list[index] = { ...list[index], image: imageBase64 };
          return { ...prev, [part]: list };
        });
      };

      const CTM_SCHEMA = {
        type: "OBJECT",
        properties: {
          title: { type: "STRING" },
          part1: {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                question: { type: "STRING" },
                options: { type: "ARRAY", items: { type: "STRING" } },
                correctAnswer: { type: "STRING" }
              },
              required: ["question", "options", "correctAnswer"]
            }
          },
          part2: {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                question: { type: "STRING" },
                statements: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      label: { type: "STRING" },
                      text: { type: "STRING" },
                      isTrue: { type: "BOOLEAN" }
                    },
                    required: ["label", "text", "isTrue"]
                  }
                }
              },
              required: ["question", "statements"]
            }
          },
          part3: {
            type: "ARRAY",
            items: {
              type: "OBJECT",
              properties: {
                question: { type: "STRING" },
                correctAnswer: { type: "STRING" }
              },
              required: ["question", "correctAnswer"]
            }
          }
        },
        required: ["part1", "part2", "part3"]
      };

      const handlePdfUpload = async (e) => {
        const file = e.target.files[0];
        if (!file || file.type !== 'application/pdf') {
            if (showToast) showToast('Vui lòng chọn file dạng PDF!', 'info');
            return;
        }

        setFileName(file.name);
        setIsProcessingPdf(true);

        try {
            const arrayBuffer = await file.arrayBuffer();
            if (window.pdfjsLib) {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    fullText += pageText + '\n';
                }
                setPdfText(fullText.trim());
                if (showToast) showToast('Đã trích xuất văn bản từ PDF thành công!', 'success');
            }
        } catch (err) {
            if (showToast) showToast('Lỗi khi đọc file PDF.', 'info');
        } finally {
            setIsProcessingPdf(false);
        }
      };

      const handleGenerateCTM = async () => {
        if (!pdfText.trim()) {
            if (showToast) showToast('Vui lòng tải PDF hoặc nhập văn bản gốc trước!', 'info');
            return;
        }
        setIsGenerating(true);

        const prompt = `Bạn là chuyên gia biên soạn đề thi Toán THPT chuẩn cấu trúc Tốt nghiệp 2025.
Hãy đọc nội dung tài liệu PDF bài tập/đề thi được cung cấp, sau đó tạo ra một đề thi gồm 3 phần bám sát 100% tài liệu đó.
Cấu trúc:
- Phần I (part1): 10 câu trắc nghiệm 4 lựa chọn (A,B,C,D).
- Phần II (part2): 2 câu trắc nghiệm Đúng/Sai (Mỗi câu 4 mệnh đề a,b,c,d).
- Phần III (part3): 3 câu trả lời ngắn (Đáp số số nguyên).
BẮT BUỘC dùng LaTeX $...$ cho công thức toán.

Nội dung gốc:
"""
${pdfText}
"""`;

        try {
          const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: CTM_SCHEMA
            }
          };

          const result = await callGeminiAPI(payload);
          const rawJson = result?.candidates?.[0]?.content?.parts?.[0]?.text;

          if (rawJson) {
            const parsedExam = JSON.parse(rawJson);
            setExamData({
                part1: parsedExam.part1 || [],
                part2: parsedExam.part2 || [],
                part3: parsedExam.part3 || []
            });
            if (parsedExam.title && !title) setTitle(parsedExam.title);
            if (showToast) showToast(`Tạo thành công đề thi 3 phần chuẩn cấu trúc 2025!`, 'success');
          }
        } catch (err) {
          if (showToast) showToast('Lỗi khi xử lý với AI. Vui lòng thử lại!', 'info');
        } finally {
          setIsGenerating(false);
        }
      };

      const submitSaveExam = () => {
          if (examData.part1.length === 0 && examData.part2.length === 0) {
              if (showToast) showToast('Đề thi trống! Hãy tạo đề bằng AI trước khi lưu.', 'info');
              return;
          }
          const newQuiz = {
              id: editingQuiz ? editingQuiz.id : 'ctm2025-' + Date.now(),
              grade,
              title,
              duration: parseInt(duration) || 90,
              description: `Đề thi Cấu Trúc Mới 2025 (Trắc nghiệm, Đúng/Sai, Trả lời ngắn)`,
              isCTM2025: true,
              part1: examData.part1,
              part2: examData.part2,
              part3: examData.part3,
              questions: []
          };
          onSave(newQuiz);
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 bg-slate-100 p-2 sm:p-6 rounded-2xl border border-slate-200">
            <aside className="lg:col-span-4 space-y-5">
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                    <h2 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
                        <FileText className="w-4 h-4 text-rose-500" /> Tải PDF Bài Tập / Đề Mẫu
                    </h2>
                    
                    <label className="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-6 bg-slate-50 hover:bg-indigo-50 transition cursor-pointer relative">
                        <input type="file" accept=".pdf" onChange={handlePdfUpload} className="hidden" />
                        {!fileName ? (
                            <div className="text-center space-y-2">
                                <Upload className="w-8 h-8 text-indigo-500 mx-auto" />
                                <p className="text-xs font-semibold text-slate-700">Kéo thả PDF hoặc bấm chọn file</p>
                            </div>
                        ) : (
                            <div className="text-left w-full bg-indigo-100 p-3 rounded-lg text-indigo-900 text-xs font-semibold flex items-center justify-between">
                                <span className="truncate max-w-[180px]">{fileName}</span>
                                <CheckCircle className="w-4 h-4 text-emerald-600 shrink-0" />
                            </div>
                        )}
                    </label>

                    <textarea 
                        rows="3" 
                        value={pdfText}
                        onChange={(e) => setPdfText(e.target.value)}
                        className="w-full mt-3 text-xs p-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none" 
                        placeholder="Văn bản trích xuất từ PDF hoặc dán nội dung..."
                    />
                </div>

                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
                    <h2 className="text-sm font-bold text-slate-800 flex items-center gap-2">
                        <Folder className="w-4 h-4 text-indigo-600" /> Thư Mục Lưu & Đăng Đề
                    </h2>
                    
                    <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">Khối Lớp:</label>
                        <select 
                            value={grade} onChange={(e) => setGrade(e.target.value)}
                            className="w-full text-xs p-2.5 border font-semibold rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none"
                        >
                            <option value="10">Toán Khối 10</option>
                            <option value="11">Toán Khối 11</option>
                            <option value="12">Toán Khối 12</option>
                        </select>
                    </div>

                    <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1">Thời gian làm bài (Phút):</label>
                        <input 
                            type="number" value={duration} onChange={(e) => setDuration(e.target.value)}
                            className="w-full text-xs p-2.5 border font-semibold rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none"
                        />
                    </div>

                    <button 
                        type="button"
                        onClick={handleGenerateCTM}
                        disabled={isGenerating || isProcessingPdf}
                        className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-3 px-4 rounded-xl shadow-md flex items-center justify-center gap-2 transition text-xs disabled:opacity-60"
                    >
                        <Sparkles className="w-4 h-4 text-yellow-300" /> 
                        {isGenerating ? 'AI Đang Tạo Đề...' : 'Tạo Đề Thi Bằng AI Cấu Trúc 2025'}
                    </button>

                    <hr className="border-slate-200" />

                    <div className="flex gap-2">
                        <button type="button" onClick={onCancel} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs py-2.5 rounded-lg font-bold transition">
                            Hủy Bỏ
                        </button>
                        <button 
                            type="button"
                            onClick={submitSaveExam}
                            className="flex-[2] bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg shadow-md flex items-center justify-center gap-2 transition text-xs"
                        >
                            <Send className="w-4 h-4" /> {editingQuiz ? 'Lưu Thay Đổi' : 'Lưu & Đăng Bài'}
                        </button>
                    </div>
                </div>
            </aside>

            <section className="lg:col-span-8">
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8 min-h-[700px] flex flex-col">
                    <div className="border-b-2 border-slate-800 pb-4 mb-6 grid grid-cols-2 gap-2 text-xs">
                        <div>
                            <input type="text" defaultValue="SỞ GD&ĐT ......... - TRƯỜNG THPT ........." className="w-full font-bold text-slate-800 border-b border-transparent hover:border-slate-300 focus:border-indigo-500 outline-none uppercase bg-transparent" />
                            <input 
                                type="text" 
                                value={title} onChange={(e) => setTitle(e.target.value)}
                                className="w-full font-extrabold text-indigo-900 text-sm border-b border-transparent hover:border-slate-300 focus:border-indigo-500 outline-none uppercase bg-transparent mt-1" 
                            />
                        </div>
                        <div className="text-right">
                            <p className="font-bold">KỲ THI TỐT NGHIỆP THPT 2025</p>
                            <p className="text-slate-600">Môn: <b>TOÁN HỌC</b> | {duration} Phút</p>
                        </div>
                    </div>

                    {isGenerating && (
                        <div className="flex-1 flex flex-col items-center justify-center space-y-4 py-12">
                            <Sparkles className="w-10 h-10 text-indigo-600 animate-spin" />
                            <p className="text-sm font-bold text-indigo-800">AI đang phân tích và tạo đề 3 phần...</p>
                        </div>
                    )}

                    {!isGenerating && examData.part1.length === 0 && examData.part2.length === 0 && examData.part3.length === 0 && (
                        <div className="flex-1 flex flex-col items-center justify-center space-y-3 py-12">
                            <FileText className="w-12 h-12 text-indigo-200" />
                            <h3 className="text-base font-bold text-slate-700">Chưa có đề thi được nạp</h3>
                            <p className="text-xs text-slate-500 max-w-sm text-center">Tải file PDF bài tập ở cột bên trái và chọn "Tạo Đề Thi Bằng AI Cấu Trúc 2025".</p>
                        </div>
                    )}

                    {!isGenerating && (examData.part1.length > 0 || examData.part2.length > 0 || examData.part3.length > 0) && (
                        <div className="space-y-8 flex-1">
                            {examData.part1.length > 0 && (
                                <div className="space-y-4">
                                    <div className="bg-indigo-50 p-2.5 rounded-lg border-l-4 border-indigo-600 flex justify-between items-center text-xs">
                                        <h3 className="font-bold text-indigo-950">PHẦN I. Câu hỏi trắc nghiệm 4 phương án lựa chọn</h3>
                                        <span className="bg-indigo-200 text-indigo-900 font-bold px-2 py-0.5 rounded">{examData.part1.length} Câu</span>
                                    </div>
                                    <div className="space-y-4">
                                        {examData.part1.map((q, idx) => (
                                            <div key={idx} className="p-4 border rounded-xl space-y-3 bg-slate-50/50 text-xs relative group">
                                                <div className="flex justify-between items-start gap-3">
                                                    <div className="font-bold text-slate-800 flex-1">
                                                        <span>Câu {idx + 1}: </span><MathText text={q.question} />
                                                    </div>
                                                    <div className="flex items-center space-x-1.5 shrink-0">
                                                        <button
                                                            type="button"
                                                            onClick={() => openEditQuestion('part1', idx)}
                                                            className="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-lg font-bold text-[11px] flex items-center gap-1 transition"
                                                            title="Sửa nội dung KaTeX và chọn lại đáp án đúng"
                                                        >
                                                            <Edit3 className="w-3.5 h-3.5" /> Sửa KaTeX & Đáp án
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => handleDeleteQuestion('part1', idx)}
                                                            className="p-1 text-rose-500 hover:bg-rose-50 rounded-lg transition"
                                                            title="Xóa câu hỏi"
                                                        >
                                                            <Trash2 className="w-3.5 h-3.5" />
                                                        </button>
                                                    </div>
                                                </div>

                                                <ImagePasteBox 
                                                    image={q.image} 
                                                    onImageChange={(img) => updatePartImage('part1', idx, img)}
                                                    label={`Đồ thị Câu ${idx + 1}`}
                                                    showToast={showToast}
                                                />

                                                <div className="grid grid-cols-2 gap-3 text-slate-700">
                                                    {q.options.map((opt, oIdx) => {
                                                        const letter = String.fromCharCode(65 + oIdx);
                                                        const isCorrect = letter === q.correctAnswer;
                                                        return (
                                                            <div key={oIdx} className={`p-2 rounded-lg border ${isCorrect ? 'bg-emerald-100 border-emerald-300 font-bold text-emerald-900 ring-1 ring-emerald-400' : 'bg-white border-slate-200'}`}>
                                                                <span className="font-bold mr-1">{letter}.</span> <MathText text={opt} />
                                                                {isCorrect && <span className="ml-1 text-[10px] text-emerald-700 font-extrabold">(Đáp án đúng)</span>}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {examData.part2.length > 0 && (
                                <div className="space-y-4 pt-4 border-t border-slate-200">
                                    <div className="bg-emerald-50 p-2.5 rounded-lg border-l-4 border-emerald-600 flex justify-between items-center text-xs">
                                        <h3 className="font-bold text-emerald-950">PHẦN II. Câu hỏi trắc nghiệm Đúng / Sai</h3>
                                        <span className="bg-emerald-200 text-emerald-900 font-bold px-2 py-0.5 rounded">{examData.part2.length} Câu</span>
                                    </div>
                                    <div className="space-y-4">
                                        {examData.part2.map((q, idx) => (
                                            <div key={idx} className="p-4 border rounded-xl space-y-3 bg-slate-50/50 text-xs">
                                                <div className="flex justify-between items-start gap-3">
                                                    <div className="font-bold text-slate-800 flex-1">
                                                        <span>Câu {idx + 1}: </span><MathText text={q.question} />
                                                    </div>
                                                    <div className="flex items-center space-x-1.5 shrink-0">
                                                        <button
                                                            type="button"
                                                            onClick={() => openEditQuestion('part2', idx)}
                                                            className="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-lg font-bold text-[11px] flex items-center gap-1 transition"
                                                            title="Sửa nội dung KaTeX và chọn lại Đúng/Sai"
                                                        >
                                                            <Edit3 className="w-3.5 h-3.5" /> Sửa KaTeX & Đáp án
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => handleDeleteQuestion('part2', idx)}
                                                            className="p-1 text-rose-500 hover:bg-rose-50 rounded-lg transition"
                                                            title="Xóa câu hỏi"
                                                        >
                                                            <Trash2 className="w-3.5 h-3.5" />
                                                        </button>
                                                    </div>
                                                </div>

                                                <ImagePasteBox 
                                                    image={q.image} 
                                                    onImageChange={(img) => updatePartImage('part2', idx, img)}
                                                    label={`Đồ thị Câu ${idx + 1}`}
                                                    showToast={showToast}
                                                />

                                                <div className="space-y-1.5">
                                                    {q.statements.map((s, sIdx) => (
                                                        <div key={sIdx} className="flex justify-between items-center text-slate-700 bg-white border border-slate-200 p-2 rounded-lg">
                                                            <div className="flex gap-2 items-start flex-1">
                                                                <span className="font-bold">{s.label})</span>
                                                                <MathText text={s.text} />
                                                            </div>
                                                            <span className={`font-bold shrink-0 ml-4 px-2 py-1 rounded text-[11px] ${s.isTrue ? 'text-emerald-700 bg-emerald-100 border border-emerald-200' : 'text-rose-700 bg-rose-100 border border-rose-200'}`}>
                                                                {s.isTrue ? 'Đúng' : 'Sai'}
                                                            </span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {examData.part3.length > 0 && (
                                <div className="space-y-4 pt-4 border-t border-slate-200">
                                    <div className="bg-amber-50 p-2.5 rounded-lg border-l-4 border-amber-600 flex justify-between items-center text-xs">
                                        <h3 className="font-bold text-amber-950">PHẦN III. Câu hỏi trả lời ngắn</h3>
                                        <span className="bg-amber-200 text-amber-900 font-bold px-2 py-0.5 rounded">{examData.part3.length} Câu</span>
                                    </div>
                                    <div className="space-y-4">
                                        {examData.part3.map((q, idx) => (
                                            <div key={idx} className="p-4 border rounded-xl space-y-3 bg-slate-50/50 text-xs">
                                                <div className="flex justify-between items-start gap-3">
                                                    <div className="font-bold text-slate-800 flex-1">
                                                        <span>Câu {idx + 1}: </span><MathText text={q.question} />
                                                    </div>
                                                    <div className="flex items-center space-x-1.5 shrink-0">
                                                        <button
                                                            type="button"
                                                            onClick={() => openEditQuestion('part3', idx)}
                                                            className="px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 rounded-lg font-bold text-[11px] flex items-center gap-1 transition"
                                                            title="Sửa nội dung KaTeX và đáp số"
                                                        >
                                                            <Edit3 className="w-3.5 h-3.5" /> Sửa KaTeX & Đáp án
                                                        </button>
                                                        <button
                                                            type="button"
                                                            onClick={() => handleDeleteQuestion('part3', idx)}
                                                            className="p-1 text-rose-500 hover:bg-rose-50 rounded-lg transition"
                                                            title="Xóa câu hỏi"
                                                        >
                                                            <Trash2 className="w-3.5 h-3.5" />
                                                        </button>
                                                    </div>
                                                </div>

                                                <ImagePasteBox 
                                                    image={q.image} 
                                                    onImageChange={(img) => updatePartImage('part3', idx, img)}
                                                    label={`Đồ thị Câu ${idx + 1}`}
                                                    showToast={showToast}
                                                />

                                                <div className="bg-white border border-indigo-200 p-2 rounded-lg text-indigo-900 font-bold flex items-center gap-2 w-fit">
                                                    <span>Đáp án đúng:</span>
                                                    <span className="bg-indigo-100 px-3 py-1 rounded text-sm">{q.correctAnswer}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            </section>

            {}
            {editModalConfig && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-4 overflow-y-auto">
                <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-2xl w-full p-6 space-y-5 my-8">
                  <div className="flex items-center justify-between border-b pb-3">
                    <div className="flex items-center space-x-2">
                      <div className="p-2 bg-indigo-100 text-indigo-700 rounded-xl">
                        <Edit3 className="w-5 h-5" />
                      </div>
                      <div>
                        <h3 className="font-bold text-slate-900 text-base">
                          Sửa Nội Dung KaTeX & Đáp Án ({editModalConfig.part === 'part1' ? 'Phần I' : editModalConfig.part === 'part2' ? 'Phần II' : 'Phần III'} - Câu {editModalConfig.index + 1})
                        </h3>
                        <p className="text-[11px] text-slate-500">Tùy chỉnh công thức LaTeX trong dấu $...$ và chỉ định đáp án đúng</p>
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={() => setEditModalConfig(null)}
                      className="text-slate-400 hover:text-slate-700 p-1"
                    >
                      <XCircle className="w-6 h-6" />
                    </button>
                  </div>

                  <div className="space-y-4 max-h-[65vh] overflow-y-auto pr-1">
                    {/* Sửa Nội dung câu hỏi */}
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Nội dung câu hỏi:</label>
                      <KatexToolbar 
                        onInsert={(str) => {
                          setEditModalConfig(prev => ({
                            ...prev,
                            data: { ...prev.data, question: (prev.data.question || '') + ' ' + str }
                          }));
                        }} 
                      />
                      <textarea
                        rows="3"
                        value={editModalConfig.data.question}
                        onChange={(e) => {
                          const val = e.target.value;
                          setEditModalConfig(prev => ({
                            ...prev,
                            data: { ...prev.data, question: val }
                          }));
                        }}
                        className="w-full text-xs p-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 font-mono"
                        placeholder="Nội dung câu hỏi..."
                      />
                      {editModalConfig.data.question && (
                        <div className="mt-1.5 p-3 bg-indigo-50/70 border border-indigo-100 rounded-xl text-xs text-indigo-950">
                          <span className="font-bold text-[10px] uppercase text-indigo-700 block mb-0.5">Xem trước KaTeX:</span>
                          <MathText text={editModalConfig.data.question} />
                        </div>
                      )}
                    </div>

                    {/* Sửa Ảnh đồ thị */}
                    <ImagePasteBox
                      image={editModalConfig.data.image}
                      onImageChange={(img) => {
                        setEditModalConfig(prev => ({
                          ...prev,
                          data: { ...prev.data, image: img }
                        }));
                      }}
                      label="Hình ảnh đồ thị câu hỏi"
                      showToast={showToast}
                    />

                    {/* PHẦN I: Sửa 4 đáp án & Chọn đáp án đúng */}
                    {editModalConfig.part === 'part1' && (
                      <div className="space-y-3 pt-2 border-t border-slate-100">
                        <label className="block text-xs font-bold text-slate-800">
                          Các lựa chọn A, B, C, D và Đáp án đúng:
                        </label>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          {(editModalConfig.data.options || []).map((opt, oIdx) => {
                            const letter = String.fromCharCode(65 + oIdx);
                            const isCorrect = letter === editModalConfig.data.correctAnswer;
                            return (
                              <div key={oIdx} className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                                <div className="flex items-center justify-between">
                                  <label className="flex items-center space-x-1.5 cursor-pointer font-bold text-xs">
                                    <input
                                      type="radio"
                                      name="ctm_edit_correct"
                                      checked={isCorrect}
                                      onChange={() => {
                                        setEditModalConfig(prev => ({
                                          ...prev,
                                          data: { ...prev.data, correctAnswer: letter }
                                        }));
                                      }}
                                      className="w-4 h-4 text-emerald-600 focus:ring-emerald-500"
                                    />
                                    <span className={isCorrect ? 'text-emerald-700 font-extrabold' : 'text-slate-700'}>
                                      Lựa chọn {letter} {isCorrect ? '(Đáp án ĐÚNG)' : ''}
                                    </span>
                                  </label>
                                </div>

                                <input
                                  type="text"
                                  value={opt}
                                  onChange={(e) => {
                                    const val = e.target.value;
                                    setEditModalConfig(prev => {
                                      const newOpts = [...prev.data.options];
                                      newOpts[oIdx] = val;
                                      return { ...prev, data: { ...prev.data, options: newOpts } };
                                    });
                                  }}
                                  className="w-full text-xs p-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 font-mono bg-white"
                                  placeholder={`Nội dung phương án ${letter}...`}
                                />

                                {opt && (
                                  <div className="text-xs text-slate-700 bg-white p-1.5 rounded border border-slate-200">
                                    <span className="text-[10px] text-slate-400 block">Hiển thị KaTeX:</span>
                                    <MathText text={opt} />
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {/* PHẦN II: Sửa 4 mệnh đề a, b, c, d & Chọn Đúng/Sai */}
                    {editModalConfig.part === 'part2' && (
                      <div className="space-y-3 pt-2 border-t border-slate-100">
                        <label className="block text-xs font-bold text-slate-800">
                          4 Mệnh đề a, b, c, d và Khẳng định Đúng/Sai:
                        </label>
                        <div className="space-y-2.5">
                          {(editModalConfig.data.statements || []).map((stmt, sIdx) => (
                            <div key={sIdx} className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                              <div className="flex items-center justify-between gap-2">
                                <span className="font-bold text-indigo-700 text-xs w-6">{stmt.label})</span>
                                <input
                                  type="text"
                                  value={stmt.text}
                                  onChange={(e) => {
                                    const val = e.target.value;
                                    setEditModalConfig(prev => {
                                      const newStmts = [...prev.data.statements];
                                      newStmts[sIdx] = { ...newStmts[sIdx], text: val };
                                      return { ...prev, data: { ...prev.data, statements: newStmts } };
                                    });
                                  }}
                                  className="flex-1 text-xs p-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 font-mono bg-white"
                                  placeholder={`Nội dung ý ${stmt.label}...`}
                                />
                                <div className="flex items-center space-x-1 shrink-0">
                                  <button
                                    type="button"
                                    onClick={() => {
                                      setEditModalConfig(prev => {
                                        const newStmts = [...prev.data.statements];
                                        newStmts[sIdx] = { ...newStmts[sIdx], isTrue: true };
                                        return { ...prev, data: { ...prev.data, statements: newStmts } };
                                      });
                                    }}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${stmt.isTrue ? 'bg-emerald-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200'}`}
                                  >
                                    Đúng
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => {
                                      setEditModalConfig(prev => {
                                        const newStmts = [...prev.data.statements];
                                        newStmts[sIdx] = { ...newStmts[sIdx], isTrue: false };
                                        return { ...prev, data: { ...prev.data, statements: newStmts } };
                                      });
                                    }}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${!stmt.isTrue ? 'bg-rose-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200'}`}
                                  >
                                    Sai
                                  </button>
                                </div>
                              </div>
                              {stmt.text && (
                                <div className="pl-8 text-xs text-slate-700">
                                  <span className="text-[10px] text-slate-400 mr-1">Hiển thị:</span>
                                  <MathText text={stmt.text} />
                                </div>
                              )}
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* PHẦN III: Sửa đáp số trả lời ngắn */}
                    {editModalConfig.part === 'part3' && (
                      <div className="pt-2 border-t border-slate-100 space-y-2">
                        <label className="block text-xs font-bold text-slate-800">
                          Đáp số đúng (Số nguyên hoặc số thập phân):
                        </label>
                        <input
                          type="text"
                          value={editModalConfig.data.correctAnswer}
                          onChange={(e) => {
                            const val = e.target.value;
                            setEditModalConfig(prev => ({
                              ...prev,
                              data: { ...prev.data, correctAnswer: val }
                            }));
                          }}
                          className="w-full sm:w-64 text-sm font-bold p-3 border-2 border-amber-300 rounded-xl outline-none focus:ring-2 focus:ring-amber-500 bg-amber-50/50"
                          placeholder="Nhập đáp số (ví dụ: 3 hoặc -5)..."
                        />
                      </div>
                    )}
                  </div>

                  <div className="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setEditModalConfig(null)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition"
                    >
                      Hủy bỏ
                    </button>
                    <button
                      type="button"
                      onClick={handleSaveEditQuestion}
                      className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1.5"
                    >
                      <CheckCircle className="w-4 h-4" />
                      <span>Lưu Thay Đổi Câu Hỏi</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
