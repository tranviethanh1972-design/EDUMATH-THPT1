    const callGeminiAPI = async (payload, retries = 3) => {
      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
      
      let delay = 1000;
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) {
            throw new Error(`Gemini API Error: Status ${response.status}`);
          }
          const result = await response.json();
          return result;
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(res => setTimeout(res, delay));
          delay *= 2;
        }
      }
    };

    const callGeminiTTS = async (textToSpeak) => {
      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
      
      const payload = {
        contents: [{
          parts: [{ text: `Hãy đọc diễn cảm bằng tiếng Việt đoạn lời giải Toán THPT sau đây một cách rõ ràng và truyền cảm: ${textToSpeak}` }]
        }],
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: {
            voiceConfig: {
              prebuiltVoiceConfig: { voiceName: "Kore" }
            }
          }
        },
        model: "gemini-2.5-flash-preview-tts"
      };

      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const result = await response.json();
      const part = result?.candidates?.[0]?.content?.parts?.[0];
      const audioData = part?.inlineData?.data;
      const mimeType = part?.inlineData?.mimeType;

      if (audioData && mimeType && mimeType.startsWith("audio/")) {
        const sampleRateMatch = mimeType.match(/rate=(\d+)/);
        const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
        
        const binaryStr = atob(audioData);
        const len = binaryStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }
        const pcm16 = new Int16Array(bytes.buffer);
        
        const numChannels = 1;
        const byteRate = sampleRate * numChannels * 2;
        const blockAlign = numChannels * 2;
        const wavBuffer = new ArrayBuffer(44 + pcm16.length * 2);
        const view = new DataView(wavBuffer);

        const writeString = (view, offset, string) => {
          for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
          }
        };

        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + pcm16.length * 2, true);
        writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, byteRate, true);
        view.setUint16(32, blockAlign, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, 'data');
        view.setUint32(40, pcm16.length * 2, true);

        for (let i = 0; i < pcm16.length; i++) {
          view.setInt16(44 + i * 2, pcm16[i], true);
        }

        const wavBlob = new Blob([wavBuffer], { type: 'audio/wav' });
        return URL.createObjectURL(wavBlob);
      }
      throw new Error("Không nhận được dữ liệu âm thanh từ Gemini TTS API.");
    };

    const MathText = ({ text }) => {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current || !text) return;

        if (window.katex) {
          const parts = text.split(/(\$[^$]+\$)/g);
          containerRef.current.innerHTML = '';
          
          parts.forEach(part => {
            if (part.startsWith('$') && part.endsWith('$') && part.length > 2) {
              const mathExpr = part.slice(1, -1);
              const span = document.createElement('span');
              try {
                window.katex.render(mathExpr, span, { throwOnError: false });
                containerRef.current.appendChild(span);
              } catch (e) {
                span.textContent = part;
                containerRef.current.appendChild(span);
              }
            } else {
              const span = document.createElement('span');
              span.textContent = part;
              containerRef.current.appendChild(span);
            }
          });
        } else {
          containerRef.current.textContent = text;
        }
      }, [text]);

      return <span ref={containerRef} className="inline-wrap" />;
    };

    const KATEX_SHORTCUTS = [
      { label: 'a/b', insert: '$\\frac{a}{b}$', title: 'Phân số' },
      { label: '√x', insert: '$\\sqrt{x}$', title: 'Căn bậc hai' },
      { label: 'x²', insert: '$x^2$', title: 'Mũ lũy thừa' },
      { label: 'x₁', insert: '$x_1$', title: 'Chỉ số dưới' },
      { label: '∫', insert: '$\\int_{a}^{b} f(x)dx$', title: 'Tích phân' },
      { label: 'lim', insert: '$\\lim_{x \\to x_0} f(x)$', title: 'Giới hạn' },
      { label: 'u⃗', insert: '$\\vec{u}$', title: 'Véc-tơ' },
      { label: '∞', insert: '$\\infty$', title: 'Vô cực' },
      { label: 'π', insert: '$\\pi$', title: 'Số Pi' },
      { label: '∈', insert: '$\\in$', title: 'Thuộc' },
      { label: 'ℝ', insert: '$\\mathbb{R}$', title: 'Tập số thực' },
      { label: '≤', insert: '$\\le$', title: 'Nhỏ hơn hoặc bằng' },

        const reader = new FileReader();

          onImageChange(ev.target.result);
          if (showToast) showToast('Đã dán ảnh đồ thị thành công!', 'success');
        };
        reader.readAsDataURL(file);
      };

      const handlePaste = (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf("image") !== -1) {
            const file = items[i].getAsFile();
            processImageFile(file);
            e.preventDefault();
            return;
          }
        }
      };

        try {

            for (const item of clipboardItems) {
              const imageType = item.types.find(type => type.startsWith('image/'));

                processImageFile(blob);
                return;

        }
      };

      const handleStudentRegister = (name, phone, password, grade) => {
        const existing = registeredStudents.find(s => s.phone === phone);
        if (existing) {
          showToast('Số điện thoại này đã được đăng ký từ trước!', 'info');
          return false;
        }

        const newStudent = { name, phone, password, grade, isPremium: false, pendingVip: false };
        setRegisteredStudents(prev => [newStudent, ...prev]);
        setCurrentStudent(newStudent);
        setStudentGrade(grade);
        saveToCloud('students', phone, newStudent);
        showToast(`Đã tạo và lưu tự động tài khoản Cloud cho ${name}!`, 'success');
        return true;
      };

      const handleStudentLogout = () => {
        setCurrentStudent(null);
        setStudentActiveQuiz(null);
        showToast('Đã đăng xuất khỏi tài khoản học sinh.', 'info');
      };

      const handleRequestVip = (phone) => {
        const updated = registeredStudents.map(s => s.phone === phone ? { ...s, pendingVip: true } : s);
        setRegisteredStudents(updated);
        const target = updated.find(s => s.phone === phone);
        if (target) saveToCloud('students', phone, target);
        setCurrentStudent(prev => ({ ...prev, pendingVip: true }));
        showToast('Đã gửi yêu cầu kích hoạt VIP lên Cloud! Vui lòng chờ duyệt.', 'success');
      };

      const handleApproveVip = (phone) => {
        const updated = registeredStudents.map(s => s.phone === phone ? { ...s, isPremium: true, pendingVip: false } : s);
        setRegisteredStudents(updated);
        const target = updated.find(s => s.phone === phone);
        if (target) saveToCloud('students', phone, target);
        showToast(`Đã phê duyệt VIP trên Cloud cho học sinh SĐT ${phone}!`, 'success');
      };

      const handleRejectVip = (phone) => {
        const updated = registeredStudents.map(s => s.phone === phone ? { ...s, pendingVip: false } : s);
        setRegisteredStudents(updated);
        const target = updated.find(s => s.phone === phone);
        if (target) saveToCloud('students', phone, target);
        showToast(`Đã từ chối yêu cầu VIP của SĐT ${phone}.`, 'info');
      };

      const handleUpdateStudentProfile = (newName, newGrade, newPassword) => {
        if (!currentStudent) return;
        const updatedStudent = {
          ...currentStudent,
          name: newName,
          grade: newGrade,
          password: newPassword
        };
        setCurrentStudent(updatedStudent);
        setRegisteredStudents(prev => prev.map(s => s.phone === currentStudent.phone ? updatedStudent : s));
        saveToCloud('students', currentStudent.phone, updatedStudent);
        setStudentGrade(newGrade);
        showToast('Cập nhật thông tin cá nhân lên Cloud thành công!', 'success');
      };

      const handleFinishQuiz = (isAutoSubmit = false) => {
        if (!studentActiveQuiz) return;
        
        let correct = 0;
        let total = 0;
        let scoreVal = 0;

        if (studentActiveQuiz.isCTM2025) {
            total = (studentActiveQuiz.part1?.length || 0) + (studentActiveQuiz.part2?.length || 0) + (studentActiveQuiz.part3?.length || 0); 
            let totalScore = 0;
            
            // Phần I: 10 câu TN 4 lựa chọn, mỗi câu đúng cho 0.5 điểm (Tối đa 5.0 điểm)
            (studentActiveQuiz.part1 || []).forEach((q, idx) => {
                if (userAnswers[`p1_${idx}`] === q.correctAnswer) {
                    totalScore += 0.5;
                    correct += 1;
                }
            });

            // Phần II: Trắc nghiệm Đúng/Sai theo thang điểm chuẩn Bộ GD&ĐT (Mỗi câu tối đa 1.0 điểm)
            // Đúng 1 ý: 0.1đ | Đúng 2 ý: 0.25đ | Đúng 3 ý: 0.5đ | Đúng 4 ý: 1.0đ
            (studentActiveQuiz.part2 || []).forEach((q, idx) => {
                let sCorrect = 0;
                (q.statements || []).forEach((s, sIdx) => {
                    const ans = userAnswers[`p2_${idx}_${sIdx}`];
                    if (ans !== undefined && ans === s.isTrue) sCorrect++;
                });
                if (sCorrect === 1) totalScore += 0.1;
                else if (sCorrect === 2) totalScore += 0.25;
                else if (sCorrect === 3) totalScore += 0.5;
                else if (sCorrect === 4) { totalScore += 1.0; correct += 1; }
            });

            // Phần III: Các câu hỏi trả lời ngắn, mỗi câu đúng cho 1.0 điểm
            (studentActiveQuiz.part3 || []).forEach((q, idx) => {
                const ans = userAnswers[`p3_${idx}`];
                if (ans !== undefined && ans !== '') {
                    const cleanAns = String(ans).trim().replace(',', '.');
                    const cleanTarget = String(q.correctAnswer).trim().replace(',', '.');
                    if (cleanAns === cleanTarget || parseFloat(cleanAns) === parseFloat(cleanTarget)) {
                        totalScore += 1.0;
                        correct += 1;
                    }
                }
            });

            // Làm tròn và định dạng chuẩn (hỗ trợ điểm lẻ .25, .5, .75 hoặc .1 của Bộ)
            const rounded = Math.min(10, Math.round(totalScore * 100) / 100);
            scoreVal = rounded % 1 === 0 ? rounded.toFixed(1) : rounded.toString();
        } else {
            studentActiveQuiz.questions.forEach((q) => {
              if (userAnswers[q.id] === q.correct) {
                correct += 1;
              }
            });
            total = studentActiveQuiz.questions.length;
            scoreVal = total > 0 ? ((correct / total) * 10).toFixed(1) : 0;
        }

        const resultObj = {
          score: parseFloat(scoreVal),
          correctCount: correct,
          totalQuestions: total,
          answers: { ...userAnswers },
          autoSubmitted: isAutoSubmit
        };

        setStudentScoreResult(resultObj);
        setQuizSubmitted(true);

        const newRecordId = 'sub-' + Date.now();
        const newRecord = {
          id: newRecordId,
          studentPhone: currentStudent ? currentStudent.phone : '',
          studentName: currentStudent ? currentStudent.name : `Học sinh Khối ${studentGrade}`,
          grade: studentGrade,
          quizTitle: studentActiveQuiz.title,
          score: parseFloat(scoreVal),
          totalQuestions: total,
          correctCount: correct,
          submittedAt: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' - ' + new Date().toLocaleDateString('vi-VN')
        };

        setSubmissionHistory(prev => [newRecord, ...prev]);
        saveToCloud('history', newRecordId, newRecord);
        showToast(isAutoSubmit ? 'Hết giờ! Bài làm đã tự động nộp lên Cloud.' : 'Đã nộp bài lên Cloud thành công!', 'success');
      };

      const startQuiz = (quiz) => {
        setStudentActiveQuiz(quiz);
        setUserAnswers({});
        setFlaggedQuestions({});
        setTimeLeft(quiz.duration * 60);
        setQuizSubmitted(false);
        setStudentScoreResult(null);
      };

      const exitQuiz = () => {
        setStudentActiveQuiz(null);
        setQuizSubmitted(false);
        setStudentScoreResult(null);
      };

      const handleDeleteQuiz = (id) => {
        const updated = quizzes.filter(q => q.id !== id);
        setQuizzes(updated);
        deleteFromCloud('quizzes', id);
        showToast('Đã xóa bài tập khỏi Cloud!', 'info');
      };

      const handleSaveQuiz = (newQuiz) => {
        let updatedQuizzes;
        if (editingQuiz) {
          updatedQuizzes = quizzes.map(q => q.id === newQuiz.id ? newQuiz : q);
          showToast(`Cập nhật thành công đề thi Khối ${newQuiz.grade} lên Cloud!`, 'success');
        } else {
          updatedQuizzes = [newQuiz, ...quizzes];
          showToast(`Đã đăng & lưu thành công đề thi Khối ${newQuiz.grade} lên Cloud!`, 'success');
        }
        setQuizzes(updatedQuizzes);
        saveToCloud('quizzes', newQuiz.id, newQuiz);
        setTeacherActiveTab('quizzes');
        setSelectedGradeFilter(newQuiz.grade);
        setEditingQuiz(null);
      };

      const handleImportQuizFile = (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;

        let loadedCount = 0;
        let allImportedList = [];

        Array.from(files).forEach((file) => {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const importedData = JSON.parse(event.target.result);
              let importedList = [];

              if (Array.isArray(importedData)) {
                importedList = importedData;
              } else if (importedData && importedData.title) {
                importedList = [importedData];
              }

              const formattedList = importedList.map(q => ({
                ...q,
                id: q.id ? q.id : 'q' + (q.grade || '12') + '-' + Date.now() + Math.random().toString(36).substr(2, 4)
              }));

              allImportedList.push(...formattedList);
            } catch (err) {}

            loadedCount++;
            if (loadedCount === files.length) {
              if (allImportedList.length > 0) {
                setQuizzes(prev => {
                  const existingIds = new Set(prev.map(p => p.id));
                  const newQuizzes = allImportedList.filter(f => !existingIds.has(f.id));
                  const updated = [...newQuizzes, ...prev];
                  newQuizzes.forEach(q => saveToCloud('quizzes', q.id, q));
                  return updated;
                });
                showToast(`Đã tải lên & đồng bộ ${allImportedList.length} đề thi lên Cloud Firestore!`, 'success');
              } else {
                showToast('Không tìm thấy file đề thi JSON hợp lệ.', 'info');
              }
              e.target.value = '';
            }
          };
          reader.readAsText(file);
        });
      };

      const handleExportSingleQuiz = (quiz) => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(quiz, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `DeThi_Khoi${quiz.grade}_${quiz.id}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast(`Đã lưu file đề "${quiz.title}" về máy thành công!`, 'success');
      };

      const handleExportAllQuizzes = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(quizzes, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `EduMath_TatCaDeThi_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast(`Đã xuất toàn bộ ${quizzes.length} đề thi thành công!`, 'success');
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans">
          <header className="bg-gradient-to-r from-blue-700 via-indigo-700 to-indigo-800 text-white shadow-md sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="bg-white/10 p-2 rounded-xl backdrop-blur-md border border-white/20">
                  <GraduationCap className="w-6 h-6 text-yellow-300" />
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight flex items-center gap-2">
                    EduMath THPT
                    <span className="text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full font-semibold flex items-center gap-1 shadow-sm">
                      <Database className="w-2.5 h-2.5" /> {isFirebaseSynced ? 'Cloud Firebase Active' : 'Auto-Sync Active'} ({registeredStudents.length*5+36} HS)
                    </span>
                  </h1>
                  <p className="text-xs text-blue-200 hidden sm:block">Cổng thông tin & Luyện tập trắc nghiệm THPT</p>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <div className="flex items-center space-x-1 bg-indigo-950/40 p-1 rounded-xl border border-indigo-400/30">
                  <button
                    onClick={() => {
                      setRole('student');
                      setStudentActiveQuiz(null);
                    }}
                    className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${
                      role === 'student'
                        ? 'bg-white text-indigo-900 shadow-sm font-semibold'
                        : 'text-blue-100 hover:text-white hover:bg-white/10'
                    }`}
                  >
                    <User className="w-4 h-4" />
                    <span>Học sinh</span>
                  </button>

                  <button
                    onClick={() => {
                      if (isTeacherLoggedIn) {
                        setRole('teacher');
                        setStudentActiveQuiz(null);
                      } else {
                        setShowTeacherModal(true);
                      }
                    }}
                    className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${
                      role === 'teacher'
                        ? 'bg-yellow-400 text-slate-900 shadow-sm font-semibold'
                        : 'text-blue-100 hover:text-white hover:bg-white/10'
                    }`}
                  >
                    <BookOpen className="w-4 h-4" />
                    <span>Giáo viên</span>
                  </button>
                </div>

                <button disabled
                  onClick={handleResetData}
                  className="p-2 text-blue-200 hover:text-white hover:bg-white/10 rounded-xl transition-all"
                  title="Khôi phục dữ liệu mẫu ban đầu"
                >
                  <RefreshCw className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          {toast && (
            <div className="fixed bottom-5 right-5 z-50 animate-bounce">
              <div className={`px-4 py-3 rounded-xl shadow-xl flex items-center space-x-2 text-sm font-medium border ${
                toast.type === 'success' 
                  ? 'bg-emerald-600 text-white border-emerald-500' 
                  : 'bg-slate-800 text-white border-slate-700'
              }`}>
                <Sparkles className="w-4 h-4 text-yellow-300" />
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {role === 'teacher' ? (
              <TeacherView 
                quizzes={quizzes}
                activeTab={teacherActiveTab}
                setActiveTab={setTeacherActiveTab}
                selectedGradeFilter={selectedGradeFilter}
                setSelectedGradeFilter={setSelectedGradeFilter}
                onDeleteQuiz={handleDeleteQuiz}
                onSaveQuiz={handleSaveQuiz}
                onExportSingleQuiz={handleExportSingleQuiz}
                onExportAllQuizzes={handleExportAllQuizzes}
                onImportQuizFile={handleImportQuizFile}
                editingQuiz={editingQuiz}
                setEditingQuiz={setEditingQuiz}
                submissionHistory={submissionHistory}
                registeredStudents={registeredStudents}
                setRegisteredStudents={setRegisteredStudents}
                onApproveVip={handleApproveVip}
                onRejectVip={handleRejectVip}
                onTeacherLogout={handleTeacherLogout}
                setConfirmDeleteState={setConfirmDeleteState}
                showToast={showToast}
              />
            ) : (
              !currentStudent ? (
                <StudentAuthView 
                  onLogin={handleStudentLogin}
                  onRegister={handleStudentRegister}
                  registeredStudents={registeredStudents}
                />
              ) : (
                <StudentView 
                  currentStudent={currentStudent}
                  registeredStudents={registeredStudents}
                  submissionHistory={submissionHistory}
                  onLogout={handleStudentLogout}
                  onRequestVip={handleRequestVip}
                  onUpdateProfile={handleUpdateStudentProfile}
                  quizzes={quizzes}
                  studentGrade={studentGrade}
                  setStudentGrade={setStudentGrade}
                  activeQuiz={studentActiveQuiz}
                  startQuiz={startQuiz}
                  exitQuiz={exitQuiz}
                  userAnswers={userAnswers}
                  setUserAnswers={setUserAnswers}
                  flaggedQuestions={flaggedQuestions}
                  setFlaggedQuestions={setFlaggedQuestions}
                  timeLeft={timeLeft}
                  quizSubmitted={quizSubmitted}
                  scoreResult={studentScoreResult}
                  handleFinishQuiz={handleFinishQuiz}
                  showToast={showToast}
                />
              )
            )}
          </main>

          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
            <p>© 2026 EduMath THPT - Cổng thông tin & Luyện tập Trắc nghiệm Toán Khối 10, 11, 12.</p>
          </footer>

          <TeacherAuthModal 
            isOpen={showTeacherModal} 
            onClose={() => setShowTeacherModal(false)} 
            onLogin={handleTeacherLogin} 
          />

          {confirmDeleteState && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full space-y-4">
                <div className="flex items-center space-x-3 text-rose-600">
                  <AlertCircle className="w-6 h-6" />
                  <h4 className="font-bold text-base text-slate-900">Xác nhận xóa tài khoản</h4>
                </div>
                <p className="text-xs text-slate-600">
                  Bạn có chắc chắn muốn xóa tài khoản học sinh SĐT <b>{confirmDeleteState.phone}</b> ({confirmDeleteState.name}) khỏi Cloud? Thao tác này không thể hoàn tác.
                </p>
                <div className="flex justify-end space-x-2 pt-2">
                  <button
                    onClick={() => setConfirmDeleteState(null)}
                    className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl"
                  >
                    Hủy bỏ
                  </button>
                  <button
                    onClick={() => {
                      setRegisteredStudents(prev => prev.filter(s => s.phone !== confirmDeleteState.phone));
                      deleteFromCloud('students', confirmDeleteState.phone);
                      showToast('Đã xóa tài khoản học sinh khỏi Cloud!', 'info');
                      setConfirmDeleteState(null);
                    }}
                    className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl shadow"
                  >
                    Xóa luôn
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function StudentAuthView({ onLogin, onRegister, registeredStudents }) {
      const [isRegister, setIsRegister] = useState(false);
      const [loginPhone, setLoginPhone] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      const [regName, setRegName] = useState('');
      const [regPhone, setRegPhone] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regGrade, setRegGrade] = useState('12');

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        onLogin(loginPhone.trim(), loginPassword.trim());
      };

      const handleRegisterSubmit = (e) => {
        e.preventDefault();
        if (!regName.trim() || !regPhone.trim() || !regPassword.trim()) return;
        const success = onRegister(regName.trim(), regPhone.trim(), regPassword.trim(), regGrade);
        if (success) {
          setRegName('');
          setRegPhone('');
          setRegPassword('');
        }
      };

      return (
        <div className="max-w-md mx-auto py-8 px-4">
          <div className="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
            <div className="bg-gradient-to-r from-indigo-700 via-indigo-800 to-slate-900 p-6 text-white text-center">
              <div className="w-14 h-14 bg-white/10 rounded-2xl border border-white/20 backdrop-blur-md flex items-center justify-center mx-auto mb-3">
                <GraduationCap className="w-8 h-8 text-yellow-300" />
              </div>
              <h2 className="text-2xl font-bold">Cổng Học Sinh THPT</h2>
              <p className="text-xs text-indigo-200 mt-1">Vui lòng đăng nhập hoặc đăng ký để làm bài tập trắc nghiệm</p>

              <div className="flex bg-indigo-950/60 p-1 rounded-xl border border-indigo-400/30 mt-5">
                <button
                  onClick={() => setIsRegister(false)}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                    !isRegister ? 'bg-white text-indigo-900 shadow-sm' : 'text-indigo-200 hover:text-white'
                  }`}
                >
                  Đăng Nhập
                </button>
                <button
                  onClick={() => setIsRegister(true)}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                    isRegister ? 'bg-yellow-400 text-slate-900 shadow-sm' : 'text-indigo-200 hover:text-white'
                  }`}
                >
                  Đăng Ký Tài Khoản Mới
                </button>
              </div>
            </div>

            {!isRegister ? (
              <form onSubmit={handleLoginSubmit} className="p-6 space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                    <Phone className="w-3.5 h-3.5 text-indigo-600" />
                    Số điện thoại
                  </label>
                  <input
                    type="tel"
                    placeholder="Nhập số điện thoại..."
                    value={loginPhone}
                    onChange={(e) => setLoginPhone(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
                    required
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                    <KeyRound className="w-3.5 h-3.5 text-indigo-600" />
                    Mật khẩu
                  </label>
                  <input
                    type="password"
                    placeholder="Nhập mật khẩu..."
                    value={loginPassword}
                    onChange={(e) => setLoginPassword(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
                    required
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-md transition-all flex items-center justify-center gap-2 mt-2"
                >
                  <UserCheck className="w-4 h-4" />
                  <span>Đăng Nhập Vào Hệ Thống</span>
                </button>
              </form>
            ) : (
              <form onSubmit={handleRegisterSubmit} className="p-6 space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                    <User className="w-3.5 h-3.5 text-indigo-600" />
                    Họ và Tên Học Sinh
                  </label>
                  <input
                    type="text"
                    placeholder="Ví dụ: Nguyễn Văn A..."
                    value={regName}
                    onChange={(e) => setRegName(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
                    required
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                    <Phone className="w-3.5 h-3.5 text-indigo-600" />
                    Số điện thoại
                  </label>
                  <input
                    type="tel"
                    placeholder="Nhập số điện thoại..."
                    value={regPhone}
                    onChange={(e) => setRegPhone(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"
                    required
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                    <KeyRound className="w-3.5 h-3.5 text-indigo-600" />
                    Mật khẩu tạo mới
                  </label>
                  <input
                    type="password"
                    placeholder="Nhập mật khẩu..."
                    value={regPassword}
                    onChange={(e) => setRegPassword(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium"

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">

                    Chọn Khối Lớp Học
                  </label>
                  <select
                    value={regGrade}
                    onChange={(e) => setRegGrade(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  >
                    <option value="10">Khối 10 (Lớp 10)</option>
                    <option value="11">Khối 11 (Lớp 11)</option>
                    <option value="12">Khối 12 (Lớp 12)</option>
                  </select>
                </div>

                <div className="bg-amber-50 p-3.5 rounded-xl border border-amber-200 text-xs text-amber-900 leading-relaxed space-y-2">
                  <div className="font-bold flex items-center gap-1.5 text-amber-950">
                    <ShieldCheck className="w-4 h-4 text-amber-700" />
                    <span>Điều khoản bảo mật tài khoản học tập:</span>
                  </div>
                  <label className="flex items-start space-x-2.5 cursor-pointer pt-1">
                    <input
                      type="checkbox"
                      id="acceptTermCheck"
                      required
                      className="mt-0.5 w-4 h-4 text-indigo-600 rounded border-amber-300 focus:ring-indigo-500 cursor-pointer"
                    />
                    <span className="text-[11px] leading-relaxed text-amber-950">
                      Tôi cam kết <b>không được cung cấp Số điện thoại và Mật khẩu</b> cho bất kỳ người thứ ba nào khác nhằm đảm bảo an toàn tuyệt đối cho dữ liệu học tập cá nhân.
                    </span>
                  </label>
                </div>

                <button
                  type="submit"
                  className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-900 rounded-xl text-sm font-bold shadow-md transition-all flex items-center justify-center gap-2 mt-2"
                >
                  <PlusCircle className="w-4 h-4" />
                  <span>Đăng Ký & Lưu Tự Động</span>
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

      const [password, setPassword] = useState('');

        onLogin(phone.trim(), password.trim());

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
          <div className="bg-white rounded-3xl border border-slate-200 shadow-2xl max-w-md w-full overflow-hidden">
            <div className="bg-gradient-to-r from-amber-500 via-orange-600 to-amber-600 p-6 text-white text-center relative">
              <button
                onClick={onClose}
                type="button"

              </button>
              <div className="w-14 h-14 bg-white/10 rounded-2xl border border-white/20 backdrop-blur-md flex items-center justify-center mx-auto mb-3">

              </div>
              <h3 className="text-xl font-bold">Xác Thực Quyền Giáo Viên</h3>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div>

                <input

                  required
                  autoFocus
                />

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                  <KeyRound className="w-3.5 h-3.5 text-amber-600" />
                  Mật khẩu xác thực
                </label>
                <input
                  type="password"
                  placeholder="Nhập mật khẩu..."
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 font-medium"
                  required
                />
              </div>

              <div className="bg-amber-50 p-3 rounded-xl border border-amber-200/70 text-[11px] text-amber-900 leading-relaxed">
                🔑 <strong>Chỉ dành cho Giáo viên:</strong><br/>
                • SĐT: <code className="font-mono bg-amber-100 px-1.5 py-0.5 rounded font-bold">****************</code><br/>
                • Mật khẩu: <code className="font-mono bg-amber-100 px-1.5 py-0.5 rounded font-bold">****************</code>
              </div>

              <div className="flex items-center space-x-3 pt-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all"
                >
                  Hủy bỏ
                </button>
                <button
                  type="submit"
                  className="flex-1 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow-md transition-all"
